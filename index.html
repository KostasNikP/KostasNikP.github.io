<script>
(function(){
  var root=document.documentElement;
  var $=function(s){return document.querySelector(s)}, $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ls=null;try{ls=window.localStorage}catch(e){}
  function get(k){try{return ls&&ls.getItem(k)}catch(e){return null}}
  function set(k,v){try{ls&&ls.setItem(k,v)}catch(e){}}
  var lang='en';function T(en,el){return lang==='el'?el:en}
  var isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
  $('#kbdHint').textContent=isMac?'⌘ K':'Ctrl K';
  $('#year').textContent=new Date().getFullYear();

  /* ---- theme ---- */
  var meta=$('meta[name=theme-color]');
  function setTheme(t){root.setAttribute('data-theme',t);meta.setAttribute('content',t==='dark'?'#0c0c0d':'#fbfbfa');set('theme',t)}
  function toggleTheme(){setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark')}
  setTheme(get('theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'));
  $('#theme').onclick=toggleTheme;

  /* ---- language ---- */
  function setLang(l){
    lang=l;root.lang=l;
    $$('[data-en]').forEach(function(e){e.innerHTML=e.getAttribute('data-'+l)||e.getAttribute('data-en')});
    $('#lang').textContent=l==='en'?'EL':'EN';set('lang',l);
    document.title=l==='en'?'Konstantinos Nikolakopoulos | Software Developer':'Κωνσταντίνος Νικολακόπουλος | Software Developer';
    $('#palInput').placeholder=T('Type a command or search…','Γράψε εντολή ή αναζήτηση…');
  }
  function toggleLang(){setLang(lang==='en'?'el':'en')}
  $('#lang').onclick=toggleLang;

  /* ---- scroll-spy ---- */
  (function(){
    var map={about:'about',skills:'skills',project:'project',experience:'experience',education:'education',more:'more',contact:'contact'};
    var links=$$('.snav a'),secs=Object.keys(map).map(function(id){return document.getElementById(id)}).filter(Boolean);
    function mark(id){links.forEach(function(a){a.classList.toggle('active',a.getAttribute('data-spy')===map[id])})}
    if('IntersectionObserver' in window){
      var so=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)mark(e.target.id)})},{rootMargin:'-30% 0px -60% 0px'});
      secs.forEach(function(el){so.observe(el)});
    }
  })();

  /* ---- reveal ---- */
  var rv=$$('.rv');
  if('IntersectionObserver' in window&&!reduce){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.08});
    rv.forEach(function(e){io.observe(e)});
  }else rv.forEach(function(e){e.classList.add('in')});
})();
</script>
